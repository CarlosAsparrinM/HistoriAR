name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run backend tests
        run: npm test

  admin-panel:
    name: Admin panel quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run panel tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app_movil
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare mobile environment asset
        run: cp .env.example .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

  web:
    name: Next.js web quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app_web_next
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: app_web_next/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Type-check web code
        run: npm run typecheck

      - name: Run web tests
        run: npm test

      - name: Build production web bundle
        run: npm run build
